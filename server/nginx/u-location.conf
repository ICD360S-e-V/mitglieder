    # Vollmacht per SMS-Link — die oeffentliche Unterschriftenseite.
    #
    # /u/app.css und /u/app.js sind echte Dateien und werden statisch
    # ausgeliefert; alles andere unter /u/ ist ein Token und geht an das
    # PHP. Deshalb try_files: die zwei Dateien zuerst, dann der Endpunkt.
    #
    # ⚠️ ^~ , nicht nur /u/ : ohne den Praefix-Vorrang gewaenne die
    # Regex-Location weiter unten, die jede *.php-artige Endung mit Zusatz
    # sperrt — ein Token wie "aB3.x" waere dann pauschal 403.
    #
    # ⚠️ Kurz gehalten, weil die Adresse in eine SMS muss. /u/<22 Zeichen>
    # sind 53 Zeichen; ueber /api/public/... waeren es 69, und der Link
    # allein braucht schon fast ein halbes GSM-7-Segment.
    location ^~ /u/ {
        # ⚠️ Eigene, grosszuegigere Zone. Das Blatt wird als EIN Bild JE
        # SEITE geladen; eine zwanzigseitige Vollmacht sind einundzwanzig
        # Anfragen in wenigen Sekunden, und die allgemeine Begrenzung
        # (burst=50) haette mitten im Lesen abgeschnitten.
        limit_req zone=speedtest_limit burst=100 nodelay;
        # ⚠️ `?$query_string` gehoert dazu. Ohne den Zusatz kommt QUERY_STRING
        # LEER beim PHP an — gemessen am 19.08.2026: `?a=seite&n=1` wurde zu
        # `$_GET = []`. Und das faellt nicht als Fehler auf, sondern als
        # falsche Seite: der Endpunkt sah keine Aktion, hielt den Aufruf fuer
        # einen gewoehnlichen Seitenaufruf und lieferte HTML statt des Bildes.
        # Das Blatt blieb leer und der Download tat nichts.
        try_files $uri /api/public/vollmacht_link.php?$query_string;
    }
