app-id: de.icd360s.Mitglieder
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: icd360sev_mitglied
separate-locales: false

# Without this, Fedora Kinoite (Mesa 25.x host) inside the flatpak 24.08
# runtime tries the Zink (OpenGL-over-Vulkan) path because the native DRI
# driver is not visible in /app/lib/GL, and fails with:
#   libEGL warning: failed to get driver name for fd -1
#   MESA-LOADER: failed to retrieve device information
#   MESA: error: zink: failed to choose pdev
# Declaring the GL add-extension makes flatpak mount the host-matched Mesa
# driver (org.freedesktop.Platform.GL.default for Intel/AMD/Nouveau, or
# .GL.nvidia-… for proprietary NVIDIA) into /app/lib/GL at install time.
add-extensions:
  org.freedesktop.Platform.GL:
    version: '24.08'
    versions: '24.08'
    directory: lib/GL
    subdirectories: true
    no-autodownload: false
    autodelete: false
    add-ld-path: lib

finish-args:
  # GUI (Wayland-first, X11 fallback)
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Sound (just_audio + WebRTC voice/video calls)
  - --socket=pulseaudio
  # Network (HTTP/WebSocket/WebRTC backend)
  - --share=network
  # Camera + microphone (for video calls + ID scan)
  - --device=all
  # File access (downloads for in-app update, documents for ID upload)
  - --filesystem=home
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Host cursor themes (Plasma Breeze etc.) for the inner GTK content area;
  # without this you get "unable to load from the cursor theme" warnings.
  - --filesystem=xdg-data/icons:ro

  # Force Mesa software rendering (llvmpipe). Required when running inside
  # a Proxmox/QEMU VM without GPU passthrough — the sandbox cannot reach a
  # real DRI device, so the native Mesa drivers fail
  # ("MESA-LOADER: failed to retrieve device information", "zink failed to
  # choose pdev", "failed to create dri2 screen") and the Flutter content
  # area stays blank Breeze-Dark gray. llvmpipe is a CPU rasterizer — slow
  # but always available, and the only path that works without a GPU.
  - --env=LIBGL_ALWAYS_SOFTWARE=1
  - --env=GALLIUM_DRIVER=llvmpipe
  # System tray (Plasma StatusNotifierItem + Ayatana fallback)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # Secret storage (flutter_secure_storage → libsecret / kwallet)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Auto-start on login
  - --talk-name=org.freedesktop.portal.Background

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/aclocal
  - /share/man
  - /share/gtk-doc
  - '*.la'
  - '*.a'

modules:
  # tray_manager Flutter plugin → libayatana-appindicator
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # flutter_secure_storage → libsecret
  - shared-modules/libsecret/libsecret.json

  - name: mitglieder
    buildsystem: simple
    build-commands:
      # `/app/lib/GL` must exist before the GL add-extension can be mounted
      # there at runtime; flatpak silently skips empty mount points otherwise.
      - mkdir -p /app/bin /app/lib/GL /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps
      - cp -r bundle/* /app/bin/
      - install -Dm644 de.icd360s.Mitglieder.desktop /app/share/applications/de.icd360s.Mitglieder.desktop
      - install -Dm644 de.icd360s.Mitglieder.metainfo.xml /app/share/metainfo/de.icd360s.Mitglieder.metainfo.xml
      - install -Dm644 de.icd360s.Mitglieder.png /app/share/icons/hicolor/256x256/apps/de.icd360s.Mitglieder.png
    sources:
      - type: dir
        path: ./bundle
        dest: bundle
      - type: file
        path: ./de.icd360s.Mitglieder.desktop
      - type: file
        path: ./de.icd360s.Mitglieder.metainfo.xml
      - type: file
        path: ./de.icd360s.Mitglieder.png
