group 'de.icd360s.icd_installer'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// Wie icd_klingel: die App setzt `android.builtInKotlin=false`, KGP muss also
// angewendet werden. ⚠️ Bei einem Umstieg auf Built-in Kotlin fliegt diese
// Zeile raus (siehe die Notiz „Built-in Kotlin" der Vorsitzer-App), sonst
// meldet das Flutter-Gradle-Plugin sie als „Plugin, das KGP selbst anwendet".
apply plugin: 'kotlin-android'

android {
    namespace 'de.icd360s.icd_installer'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Wie die App. Ein HÖHERER Wert als der der App bricht die
        // Manifest-Zusammenführung.
        minSdkVersion flutter.minSdkVersion
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}
