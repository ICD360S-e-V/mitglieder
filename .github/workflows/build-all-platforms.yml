# CI/CD workflow for ICD360S e.V. Mitgliederportal
# 4 jobs: Linux, Android, Apple, Windows
# Smart cache: skips platforms unchanged since last successful build
name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # DETECT: compare file hashes with last successful build
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.flags.outputs.linux }}
      android: ${{ steps.flags.outputs.android }}
      apple: ${{ steps.flags.outputs.apple }}
      windows: ${{ steps.flags.outputs.windows }}
      linux_hash: ${{ steps.check.outputs.linux_hash }}
      android_hash: ${{ steps.check.outputs.android_hash }}
      apple_hash: ${{ steps.check.outputs.apple_hash }}
      win_hash: ${{ steps.check.outputs.win_hash }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute hashes
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "android=true" >> $GITHUB_OUTPUT
            echo "apple=true" >> $GITHUB_OUTPUT
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "linux_hash=force" >> $GITHUB_OUTPUT
            echo "android_hash=force" >> $GITHUB_OUTPUT
            echo "apple_hash=force" >> $GITHUB_OUTPUT
            echo "win_hash=force" >> $GITHUB_OUTPUT
            echo "BUILD ALL: tag or manual trigger"
            exit 0
          fi

          SHARED=$(find lib/ pubspec.yaml l10n.yaml -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)

          LINUX_H=$(echo "$SHARED"; find linux/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && LINUX_H=$(echo "$LINUX_H" | sha256sum | cut -d' ' -f1)
          ANDROID_H=$(echo "$SHARED"; find android/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && ANDROID_H=$(echo "$ANDROID_H" | sha256sum | cut -d' ' -f1)
          APPLE_H=$(echo "$SHARED"; find ios/ macos/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && APPLE_H=$(echo "$APPLE_H" | sha256sum | cut -d' ' -f1)
          WIN_H=$(echo "$SHARED"; find windows/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && WIN_H=$(echo "$WIN_H" | sha256sum | cut -d' ' -f1)

          echo "Hashes: LINUX=$LINUX_H ANDROID=$ANDROID_H APPLE=$APPLE_H WIN=$WIN_H"
          echo "linux_hash=$LINUX_H" >> $GITHUB_OUTPUT
          echo "android_hash=$ANDROID_H" >> $GITHUB_OUTPUT
          echo "apple_hash=$APPLE_H" >> $GITHUB_OUTPUT
          echo "win_hash=$WIN_H" >> $GITHUB_OUTPUT

          # Dummy files for cache lookup
          echo "$LINUX_H" > /tmp/linux-h.txt
          echo "$ANDROID_H" > /tmp/android-h.txt
          echo "$APPLE_H" > /tmp/apple-h.txt
          echo "$WIN_H" > /tmp/win-h.txt

      - name: Check Linux cache
        id: cache-linux
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/linux-h.txt
          key: v3-build-ok-linux-${{ steps.check.outputs.linux_hash }}
          lookup-only: true

      - name: Check Android cache
        id: cache-android
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/android-h.txt
          key: v3-build-ok-android-${{ steps.check.outputs.android_hash }}
          lookup-only: true

      - name: Check Apple cache
        id: cache-apple
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/apple-h.txt
          key: v3-build-ok-apple-${{ steps.check.outputs.apple_hash }}
          lookup-only: true

      - name: Check Windows cache
        id: cache-win
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/win-h.txt
          key: v3-build-ok-windows-${{ steps.check.outputs.win_hash }}
          lookup-only: true

      - name: Set build flags
        id: flags
        run: |
          for platform in linux android apple windows; do
            CACHE_VAR="cache-${platform}"
            if [ "$platform" = "windows" ]; then CACHE_VAR="cache-win"; fi

            HIT="${{ steps.cache-linux.outputs.cache-hit }}"
            case "$platform" in
              android) HIT="${{ steps.cache-android.outputs.cache-hit }}" ;;
              apple) HIT="${{ steps.cache-apple.outputs.cache-hit }}" ;;
              windows) HIT="${{ steps.cache-win.outputs.cache-hit }}" ;;
            esac

            if [ "$HIT" == "true" ]; then
              echo "→ $platform: SKIP (already built)"
              echo "$platform=false" >> $GITHUB_OUTPUT
            else
              echo "→ $platform: BUILD"
              echo "$platform=true" >> $GITHUB_OUTPUT
            fi
          done

  # ============================================
  # LINUX desktop + packages
  # ============================================
  build-linux:
    name: Linux
    needs: detect-changes
    if: needs.detect-changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libnotify-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Compute build number from version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        run: flutter build linux --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }}

      - name: Upload Linux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

      # --- Linux Packages ---
      - name: Install packaging tools
        run: |
          sudo apt-get install -y ruby-dev rpm libfuse2
          sudo gem install fpm
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Create .deb
        run: |
          BUNDLE=build/linux/x64/release/bundle
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p /tmp/scripts
          printf '#!/bin/sh\nln -sf /opt/icd360sev-mitglied/icd360sev_mitglied /usr/local/bin/icd360sev_mitglied\n' > /tmp/scripts/postinst
          chmod +x /tmp/scripts/postinst
          fpm -s dir -t deb --name icd360sev-mitglied --version "$VERSION" \
            --description "ICD360S e.V. Mitglieder-App" --maintainer "ICD360S e.V." \
            --url "https://icd360s.de" --license "Proprietary" --architecture amd64 \
            --depends libgtk-3-0 --depends libsecret-1-0 --depends libjsoncpp25 --depends libnotify4 \
            --after-install /tmp/scripts/postinst \
            "$BUNDLE/=/opt/icd360sev-mitglied/" \
            "linux/icd360sev_mitglied.desktop=/usr/share/applications/icd360sev_mitglied.desktop"
          mv icd360sev-mitglied_*.deb icd360sev-mitglied.deb

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-deb
          path: icd360sev-mitglied.deb
          if-no-files-found: error

      - name: Create .rpm
        run: |
          BUNDLE=build/linux/x64/release/bundle
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          fpm -s dir -t rpm --name icd360sev-mitglied --version "$VERSION" \
            --description "ICD360S e.V. Mitglieder-App" --maintainer "ICD360S e.V." \
            --url "https://icd360s.de" --license "Proprietary" --architecture x86_64 \
            --depends gtk3 --depends libsecret --depends jsoncpp --depends libnotify \
            --after-install /tmp/scripts/postinst \
            "$BUNDLE/=/opt/icd360sev-mitglied/" \
            "linux/icd360sev_mitglied.desktop=/usr/share/applications/icd360sev_mitglied.desktop"
          mv icd360sev-mitglied-*.rpm icd360sev-mitglied.rpm

      - name: Upload .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-rpm
          path: icd360sev-mitglied.rpm
          if-no-files-found: error

      - name: Create AppImage
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications
          cp -r "$BUNDLE"/* AppDir/usr/bin/
          [ -d "AppDir/usr/bin/lib" ] && mv AppDir/usr/bin/lib/* AppDir/usr/lib/ && rmdir AppDir/usr/bin/lib
          cp linux/icd360sev_mitglied.desktop AppDir/
          cp linux/icd360sev_mitglied.desktop AppDir/usr/share/applications/
          printf '#!/bin/bash\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/icd360sev_mitglied" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > AppDir/icd360sev_mitglied.png
          ARCH=x86_64 appimagetool --no-appstream AppDir icd360sev-mitglied.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-appimage
          path: icd360sev-mitglied.AppImage
          if-no-files-found: error

      - name: Save cache marker
        run: echo "ok" > /tmp/linux-ok.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/linux-ok.txt
          key: v3-build-ok-linux-${{ needs.detect-changes.outputs.linux_hash }}

  # ============================================
  # ANDROID - each flavor in its own matrix job (separate memory)
  # ============================================
  build-android:
    name: Android (${{ matrix.flavor }})
    needs: detect-changes
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: universal
            build_cmd: "flutter build apk --release --flavor fdroid --obfuscate --split-debug-info=build/symbols"
            apk_path: "build/app/outputs/flutter-apk/app-fdroid-release.apk"
            artifact_name: icd360sev-universal-apk
          - flavor: fdroid
            build_cmd: "flutter build apk --release --flavor fdroid --obfuscate --split-debug-info=build/symbols --split-per-abi"
            apk_path: "build/app/outputs/flutter-apk/app-arm64-v8a-fdroid-release.apk"
            artifact_name: icd360sev-fdroid-apk
          - flavor: googleplay
            build_cmd: "flutter build apk --release --flavor googleplay --obfuscate --split-debug-info=build/symbols --split-per-abi"
            apk_path: "build/app/outputs/flutter-apk/app-arm64-v8a-googleplay-release.apk"
            artifact_name: icd360sev-googleplay-apk
          - flavor: googleplay-aab
            build_cmd: "flutter build appbundle --release --flavor googleplay --obfuscate --split-debug-info=build/symbols"
            apk_path: "build/app/outputs/bundle/googleplayRelease/app-googleplay-release.aab"
            artifact_name: icd360sev-googleplay-aab
          - flavor: amazon
            build_cmd: "flutter build apk --release --flavor amazon --obfuscate --split-debug-info=build/symbols --split-per-abi"
            apk_path: "build/app/outputs/flutter-apk/app-arm64-v8a-amazon-release.apk"
            artifact_name: icd360sev-amazon-apk
          - flavor: huawei
            build_cmd: "flutter build apk --release --flavor huawei --obfuscate --split-debug-info=build/symbols --split-per-abi"
            apk_path: "build/app/outputs/flutter-apk/app-arm64-v8a-huawei-release.apk"
            artifact_name: icd360sev-huawei-apk
          - flavor: samsung
            build_cmd: "flutter build apk --release --flavor samsung --obfuscate --split-debug-info=build/symbols --split-per-abi"
            apk_path: "build/app/outputs/flutter-apk/app-arm64-v8a-samsung-release.apk"
            artifact_name: icd360sev-samsung-apk
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Compute build number from version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/release-keystore.jks

      - name: Build APK (${{ matrix.flavor }})
        run: ${{ matrix.build_cmd }} --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }}
        env:
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.apk_path }}
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: symbols-android-${{ matrix.flavor }}
          path: build/symbols/

  # Save Android cache marker (runs after all matrix jobs)
  save-android-cache:
    name: Save Android Cache
    needs: [detect-changes, build-android]
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok" > /tmp/android-ok.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/android-ok.txt
          key: v3-build-ok-android-${{ needs.detect-changes.outputs.android_hash }}

  # ============================================
  # APPLE (iOS + macOS) - 1 runner
  # ============================================
  build-apple:
    name: Apple (iOS + macOS)
    needs: detect-changes
    if: needs.detect-changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Compute build number from version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      # --- iOS Build ---
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }}

      - name: Upload iOS .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

      # --- macOS Build ---
      - name: Disable macOS code signing for CI
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Mac Development"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Sign to Run Locally"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = B42ZX94AKL/DEVELOPMENT_TEAM = ""/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = .*$/CODE_SIGN_ENTITLEMENTS = "";/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS
        run: flutter build macos --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }}

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/icd360sev_mitglied.app"
          # Remove quarantine attributes so users don't get "damaged app" warning
          xattr -cr "$APP_PATH"
          DMG_DIR="build/dmg"
          mkdir -p "$DMG_DIR"
          cp -r "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "ICD360S Mitglieder" -srcfolder "$DMG_DIR" \
            -ov -format UDZO "build/icd360sev-mitglied.dmg"

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-macos
          path: build/icd360sev-mitglied.dmg
          if-no-files-found: error

      - name: Save cache marker
        run: echo "ok" > /tmp/apple-ok.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/apple-ok.txt
          key: v3-build-ok-apple-${{ needs.detect-changes.outputs.apple_hash }}

  # ============================================
  # WINDOWS - 1 runner
  # ============================================
  build-windows:
    name: Windows
    needs: detect-changes
    if: needs.detect-changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Replace flutter_webrtc plugin junction with a real directory copy
        # The Windows runner now ships CMake ≥3.30, whose bundled libarchive
        # refuses to extract archives through filesystem symlinks/junctions:
        #   CMake Error: Cannot extract through symlink
        #   …\windows\flutter\ephemeral\.plugin_symlinks\flutter_webrtc
        # `flutter pub get` creates that path as a Windows junction pointing
        # at the package in the pub cache, and flutter_webrtc's
        # third_party/CMakeLists.txt then tries file(ARCHIVE_EXTRACT) inside
        # it. Replacing the junction with a regular copy keeps Flutter happy
        # (it only checks that the path exists) and removes the symlink that
        # CMake refuses to traverse.
        shell: pwsh
        run: |
          $sym = "windows/flutter/ephemeral/.plugin_symlinks/flutter_webrtc"
          if (-not (Test-Path $sym)) {
            Write-Host "$sym does not exist yet — flutter build will create it; skipping"
            exit 0
          }
          $item = Get-Item $sym -Force
          if (-not $item.Target) {
            Write-Host "$sym is not a junction; nothing to do"
            exit 0
          }
          $target = ($item.Target | Select-Object -First 1).TrimEnd('\','/')
          Write-Host "flutter_webrtc junction → $target"
          # Use .NET Directory.Delete so the forward slashes in $sym are not
          # mis-parsed as command-line switches (cmd /c rmdir choked on the
          # "/flutter/" segment as if it were a flag). recursive=$false means
          # the junction entry itself is removed; the target tree in the pub
          # cache stays untouched.
          [System.IO.Directory]::Delete($sym, $false)
          # robocopy is more reliable than Copy-Item for large recursive
          # trees and survives long paths. /E = include subdirs incl. empty,
          # /NFL /NDL /NJH /NJS = quiet output. Exit codes 0-7 are success
          # for robocopy; >7 is a real failure.
          $rc = (Start-Process robocopy -ArgumentList $target, $sym, '/E','/NFL','/NDL','/NJH','/NJS' -Wait -NoNewWindow -PassThru).ExitCode
          if ($rc -gt 7) { throw "robocopy failed with code $rc" }
          Write-Host "Replaced junction with copy at $sym"

      - name: Compute build number from version
        id: ver
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build Windows
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.version.outputs.version }}" windows\installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-windows
          path: icd360sev_setup.exe
          if-no-files-found: error

      - name: Save cache marker
        shell: bash
        run: echo "ok" > "$RUNNER_TEMP/win-ok.txt"
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.temp }}/win-ok.txt
          key: v3-build-ok-windows-${{ needs.detect-changes.outputs.win_hash }}

  # ============================================
  # Release (only on version tags)
  # ============================================
  # ============================================
  # FLATPAK (.flatpak single-file bundle for Linux)
  # Repackages the linux bundle artifact built by `build-linux` and ships
  # the result as a GitHub Release asset. Users install with
  #   flatpak install --user icd360sev-mitglied.flatpak
  # No OSTree repo — single-file delivery only, no VPS dependency.
  # ============================================
  flatpak:
    name: Flatpak
    needs: [detect-changes, build-linux]
    if: needs.detect-changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: icd360sev-linux
          path: flatpak/bundle

      - name: Make Flutter binary executable
        run: chmod +x flatpak/bundle/icd360sev_mitglied

      - name: Clone Flathub shared-modules
        run: git clone --depth 1 --branch master https://github.com/flathub/shared-modules.git flatpak/shared-modules

      - name: Inject current version into AppStream metainfo
        run: |
          TAG="${GITHUB_REF_NAME:-v1.8.0}"
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - <<PYEOF
          import re
          path = 'flatpak/de.icd360s.Mitglieder.metainfo.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          new_releases = f'''  <releases>
            <release version="$VERSION" date="$DATE">
              <description>
                <p>Version $VERSION — neueste Aktualisierung.</p>
              </description>
            </release>
          </releases>'''
          content = re.sub(r'  <releases>.*?</releases>', new_releases, content, flags=re.DOTALL)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Injected version=$VERSION date=$DATE into metainfo.xml')
          PYEOF
          cat flatpak/de.icd360s.Mitglieder.metainfo.xml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: icd360sev-mitglied.flatpak
          manifest-path: flatpak/de.icd360s.Mitglieder.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-flatpak
          path: icd360sev-mitglied.flatpak
          if-no-files-found: error

      # ---- OSTree repo for `flatpak update` (served from GitHub Pages) ----

      - name: Update OSTree repo metadata + static deltas
        # flatpak-builder leaves the OSTree repo at ./repo; this rewrites the
        # summary so `flatpak update` clients can resolve refs, and generates
        # static deltas to keep per-update downloads small. Prune to last 3
        # versions — full history is in git, the repo doesn't need to keep it.
        run: |
          flatpak build-update-repo --generate-static-deltas \
            --title="ICD360S e.V. Mitglieder" \
            --prune --prune-depth=3 repo
          du -sh repo

      - name: Assemble gh-pages publish tree
        # Layout served at https://icd360s-e-v.github.io/mitglieder/:
        #   /repo/                            — OSTree repo (flatpak update reads here)
        #   /icd360s-mitglieder.flatpakrepo   — descriptor users `flatpak remote-add` from
        #   /index.html                       — landing page with install instructions
        run: |
          mkdir -p pages-out
          cp -r repo pages-out/repo
          cat > pages-out/icd360s-mitglieder.flatpakrepo <<'EOF'
          [Flatpak Repo]
          Title=ICD360S e.V. Mitglieder
          Url=https://icd360s-e-v.github.io/mitglieder/repo/
          Homepage=https://github.com/ICD360S-e-V/mitglieder
          Comment=Mitgliederportal Auto-Update Repository
          Description=Auto-update Flatpak repository for the ICD360S e.V. member app.
          NoDeps=true
          EOF
          cat > pages-out/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <title>ICD360S e.V. Mitglieder — Flatpak Repo</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1rem; line-height: 1.55; color: #222; }
              code, pre { background: #f4f4f4; border-radius: 4px; font-size: 0.9rem; }
              code { padding: 0.1rem 0.35rem; }
              pre { padding: 1rem; overflow-x: auto; }
              a { color: #1a73e8; }
            </style>
          </head>
          <body>
            <h1>ICD360S e.V. Mitglieder — Flatpak Repository</h1>
            <p>Auto-Update für die Mitglieder-App. Einmal hinzufügen, danach läuft <code>flatpak update</code> automatisch beim nächsten Release.</p>
            <h2>Installation</h2>
            <pre>flatpak remote-add --user --if-not-exists icd360s-mitglieder \
            https://icd360s-e-v.github.io/mitglieder/icd360s-mitglieder.flatpakrepo
          flatpak install --user icd360s-mitglieder de.icd360s.Mitglieder</pre>
            <h2>Update</h2>
            <pre>flatpak update --user</pre>
            <p>Quellcode: <a href="https://github.com/ICD360S-e-V/mitglieder">github.com/ICD360S-e-V/mitglieder</a></p>
          </body>
          </html>
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatpak-pages
          path: pages-out
          if-no-files-found: error

  # ============================================
  # FLATPAK auto-update repo → GitHub Pages
  # Publishes the OSTree repo + .flatpakrepo descriptor to the gh-pages
  # branch. After the first run, enable the branch under repo Settings →
  # Pages → Build and deployment → Source: "Deploy from a branch", branch
  # `gh-pages`, folder `/ (root)`. From then on, every release tag updates
  # the OSTree repo and clients pick it up via `flatpak update`.
  # ============================================
  deploy-flatpak-pages:
    name: Deploy Flatpak repo to GitHub Pages
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flatpak-pages
          path: pages-out

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-out
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          commit_message: "deploy: flatpak repo ${{ github.ref_name }}"

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-android, save-android-cache, build-apple, build-windows, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release/

          # Android APKs + AAB
          cp artifacts/icd360sev-universal-apk/* release/icd360sev-universal.apk
          cp artifacts/icd360sev-fdroid-apk/*.apk release/icd360sev-fdroid.apk
          cp artifacts/icd360sev-googleplay-apk/*.apk release/icd360sev-googleplay.apk
          cp artifacts/icd360sev-googleplay-aab/* release/icd360sev-googleplay.aab
          cp artifacts/icd360sev-amazon-apk/*.apk release/icd360sev-amazon.apk
          cp artifacts/icd360sev-huawei-apk/*.apk release/icd360sev-huawei.apk
          cp artifacts/icd360sev-samsung-apk/*.apk release/icd360sev-samsung.apk

          # Windows installer
          cp artifacts/icd360sev-windows/icd360sev_setup.exe release/icd360sev_setup.exe

          # macOS DMG
          cp artifacts/icd360sev-macos/icd360sev-mitglied.dmg release/icd360sev-mitglied.dmg

          # iOS .app (zip for download)
          cd artifacts/icd360sev-ios && zip -r ../../release/icd360sev-ios.app.zip . && cd ../..

          # Linux raw bundle
          cd artifacts/icd360sev-linux && tar czf ../../release/icd360sev-linux.tar.gz . && cd ../..

          # Linux packages
          cp artifacts/icd360sev-linux-deb/*.deb release/icd360sev-mitglied.deb
          cp artifacts/icd360sev-linux-rpm/*.rpm release/icd360sev-mitglied.rpm
          cp artifacts/icd360sev-linux-appimage/*.AppImage release/icd360sev-mitglied.AppImage

          # Flatpak (single-file bundle, Fedora Kinoite / SteamOS / Flathub-style)
          cp artifacts/icd360sev-flatpak/icd360sev-mitglied.flatpak release/icd360sev-mitglied.flatpak

          echo "Release files:"
          ls -lh release/

      - name: Generate per-platform version manifests
        # Each manifest lives as a release asset; the in-app updater fetches it
        # via the `releases/latest/download/<name>.json` URL, which always
        # resolves to the most recent tag without anyone having to update a
        # version constant. Replaces the previous flow that scp'd manifests to
        # the VPS at /api/data/version_mitglieder_*.json.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"          # e.g. v1.7.0
          VERSION="${TAG#v}"                 # 1.7.0
          IFS=. read MAJ MIN PAT <<< "$VERSION"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          RELEASE_DATE=$(date -u +%F)
          REPO_URL="https://github.com/${{ github.repository }}"

          # Previous release tag — used as the fallback download URL when
          # users decline the new version.
          FALLBACK_TAG=$(gh api repos/${{ github.repository }}/releases \
            --jq '[.[] | select(.tag_name | test("^v[0-9]"))] | map(.tag_name) | .[1] // ""')
          FALLBACK_VERSION="${FALLBACK_TAG#v}"
          BASE_DL="${REPO_URL}/releases/download/${TAG}"
          BASE_FB="${REPO_URL}/releases/download/${FALLBACK_TAG}"

          CHANGELOG="Version ${VERSION}\\n\\nSee full changelog at ${REPO_URL}/releases/tag/${TAG}"

          write_manifest() {
            local out=$1 file=$2
            local sha mb size
            sha=$(sha256sum "release/$file" | awk '{print $1}')
            size=$(stat -c%s "release/$file")
            mb=$(( (size + 524288) / 1048576 ))
            cat > "release/$out" <<JSON
          {
              "version": "${VERSION}",
              "build_number": ${BUILD},
              "download_url": "${BASE_DL}/${file}",
              "fallback_url": "${BASE_FB}/${file}",
              "fallback_version": "${FALLBACK_VERSION}",
              "changelog": "${CHANGELOG}",
              "min_version": null,
              "force_update": false,
              "release_date": "${RELEASE_DATE}",
              "file_size": "${mb} MB",
              "sha256": "${sha}"
          }
          JSON
          }

          write_manifest version_mitglieder_android.json  icd360sev-universal.apk
          write_manifest version_mitglieder_windows.json  icd360sev_setup.exe
          write_manifest version_mitglieder_macos.json    icd360sev-mitglied.dmg
          write_manifest version_mitglieder_linux.json    icd360sev-mitglied.AppImage

          echo "Generated manifests:"
          ls -lh release/version_mitglieder_*.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: release/*
