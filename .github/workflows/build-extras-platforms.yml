# CI/CD workflow — extra platforms (Windows + iOS + macOS)
# Best-effort: a transient runner failure on PRs does not block review.
# On tag pushes, the priority workflow creates the GitHub Release first;
# this workflow polls until that release exists, then appends the Windows
# .exe + macOS .dmg + iOS .app.zip + matching manifest JSONs to the same
# release tag. Splitting the slow runners off here means the Android +
# Linux + Flatpak download buttons in the Actions UI become clickable as
# soon as that workflow completes, without waiting on Apple/Windows.
name: Build Extra Platforms (Windows + iOS + macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Single concurrency lane across ALL refs. When a newer tag arrives
# while an older Windows/iOS/macOS build is still running/queued, the
# older one is cancelled — only the latest version's installers append
# to the GitHub Release the priority workflow created. Trade-off:
# ~10-15 min of cancelled-build work in the worst case, vs ~2h of
# queue pile-up before this fix (each version bump previously got its
# own lane via github.ref).
concurrency:
  group: mitglieder-extras
  cancel-in-progress: true

env:
  # Same pin as build-priority-platforms.yml — kept consistent across both
  # workflows so a tag rebuilds every artifact off the same SDK. The
  # Windows junction → robocopy step below survives the downgrade because
  # the CMake refusal-to-extract-through-symlinks policy is enforced by
  # the runner's CMake, not by Flutter.
  FLUTTER_VERSION: '3.38.4'
  JAVA_VERSION: '17'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # DETECT: compare file hashes with last successful build (extras only)
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.flags.outputs.apple }}
      windows: ${{ steps.flags.outputs.windows }}
      apple_hash: ${{ steps.check.outputs.apple_hash }}
      win_hash: ${{ steps.check.outputs.win_hash }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute hashes
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "apple=true" >> $GITHUB_OUTPUT
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "apple_hash=force" >> $GITHUB_OUTPUT
            echo "win_hash=force" >> $GITHUB_OUTPUT
            echo "BUILD ALL: tag or manual trigger"
            exit 0
          fi

          SHARED=$(find lib/ pubspec.yaml l10n.yaml -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)

          APPLE_H=$(echo "$SHARED"; find ios/ macos/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && APPLE_H=$(echo "$APPLE_H" | sha256sum | cut -d' ' -f1)
          WIN_H=$(echo "$SHARED"; find windows/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && WIN_H=$(echo "$WIN_H" | sha256sum | cut -d' ' -f1)

          echo "Hashes: APPLE=$APPLE_H WIN=$WIN_H"
          echo "apple_hash=$APPLE_H" >> $GITHUB_OUTPUT
          echo "win_hash=$WIN_H" >> $GITHUB_OUTPUT

          echo "$APPLE_H" > /tmp/apple-h.txt
          echo "$WIN_H" > /tmp/win-h.txt

      - name: Check Apple cache
        id: cache-apple
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/apple-h.txt
          key: v3-build-ok-apple-${{ steps.check.outputs.apple_hash }}
          lookup-only: true

      - name: Check Windows cache
        id: cache-win
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/win-h.txt
          key: v3-build-ok-windows-${{ steps.check.outputs.win_hash }}
          lookup-only: true

      - name: Set build flags
        id: flags
        run: |
          for platform in apple windows; do
            HIT="${{ steps.cache-apple.outputs.cache-hit }}"
            case "$platform" in
              windows) HIT="${{ steps.cache-win.outputs.cache-hit }}" ;;
            esac
            if [ "$HIT" == "true" ]; then
              echo "→ $platform: SKIP (already built)"
              echo "$platform=false" >> $GITHUB_OUTPUT
            else
              echo "→ $platform: BUILD"
              echo "$platform=true" >> $GITHUB_OUTPUT
            fi
          done

  # ============================================
  # ANALYZE: fast-fail on type/import errors before macOS + Windows runners.
  # Mirrored from the priority workflow so we don't take a cross-workflow
  # output dependency.
  # ============================================
  analyze:
    name: Analyze
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.apple == 'true' ||
      needs.detect-changes.outputs.windows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # Caches ~/.pub-cache by pubspec.lock hash. Shared across all three
          # build workflows: first job to populate it (~30-60s) makes the
          # other two near-instant (`flutter pub get` becomes a no-op).
          pub-cache: true
      - name: Cache .dart_tool (l10n + pub artifacts)
        id: dart-tool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'l10n.yaml', 'lib/l10n/*.arb') }}
      - name: Get dependencies
        run: flutter pub get
      - name: Generate l10n
        if: steps.dart-tool-cache.outputs.cache-hit != 'true'
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # ============================================
  # APPLE (iOS + macOS)
  # ============================================
  build-apple:
    name: Apple (iOS + macOS)
    needs: [detect-changes, analyze]
    if: needs.detect-changes.outputs.apple == 'true'
    runs-on: macos-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # Caches ~/.pub-cache by pubspec.lock hash. Shared across all three
          # build workflows: first job to populate it (~30-60s) makes the
          # other two near-instant (`flutter pub get` becomes a no-op).
          pub-cache: true

      - name: Cache .dart_tool (l10n + pub artifacts)
        id: dart-tool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .dart_tool
          # OS-keyed so analyze (Linux) doesn't collide with the macOS or
          # Windows build trees. Saves gen-l10n on rebuilds.
          key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'l10n.yaml', 'lib/l10n/*.arb') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        if: steps.dart-tool-cache.outputs.cache-hit != 'true'
        run: flutter gen-l10n

      - name: Compute build number from version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      # --- iOS Build ---
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }} --dart-define=STARTUP_DIAG_KEY=${{ secrets.MITGLIEDER_STARTUP_DIAG_KEY }}

      - name: Upload iOS .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

      # --- macOS Build ---
      - name: Disable macOS code signing for CI
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Mac Development"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Sign to Run Locally"/CODE_SIGN_IDENTITY = "-"/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = B42ZX94AKL/DEVELOPMENT_TEAM = ""/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_ENTITLEMENTS = .*$/CODE_SIGN_ENTITLEMENTS = "";/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Bump WebRTC-SDK lock to match flutter_webrtc 1.5.2
        # flutter_webrtc 1.5.2's macOS podspec requires
        # WebRTC-SDK = 144.7559.09, but Podfile.lock was pinned to
        # 144.7559.01 from an older snapshot — CocoaPods refuses to
        # bridge that gap with plain `pod install`. `pod update
        # WebRTC-SDK` (with --repo-update so the trunk specs are
        # current) re-resolves only that pod, rewriting the lock to
        # the latest 144.7559.x available. `flutter build macos`
        # then calls pod install on a satisfiable lock.
        run: |
          cd macos
          pod update WebRTC-SDK --repo-update
          cd ..

      - name: Build macOS
        run: flutter build macos --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }} --dart-define=STARTUP_DIAG_KEY=${{ secrets.MITGLIEDER_STARTUP_DIAG_KEY }}

      - name: Create DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/icd360sev_mitglied.app"
          xattr -cr "$APP_PATH"
          DMG_DIR="build/dmg"
          mkdir -p "$DMG_DIR"
          cp -r "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "ICD360S Mitglieder" -srcfolder "$DMG_DIR" \
            -ov -format UDZO "build/icd360sev-mitglied.dmg"

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-macos
          path: build/icd360sev-mitglied.dmg
          if-no-files-found: error

      - name: Save cache marker
        run: echo "ok" > /tmp/apple-ok.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/apple-ok.txt
          key: v3-build-ok-apple-${{ needs.detect-changes.outputs.apple_hash }}

  # ============================================
  # WINDOWS
  # ============================================
  build-windows:
    name: Windows
    needs: [detect-changes, analyze]
    if: needs.detect-changes.outputs.windows == 'true'
    runs-on: windows-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # Caches ~/.pub-cache by pubspec.lock hash. Shared across all three
          # build workflows: first job to populate it (~30-60s) makes the
          # other two near-instant (`flutter pub get` becomes a no-op).
          pub-cache: true

      - name: Cache .dart_tool (l10n + pub artifacts)
        id: dart-tool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .dart_tool
          # OS-keyed so analyze (Linux) doesn't collide with the macOS or
          # Windows build trees. Saves gen-l10n on rebuilds.
          key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'l10n.yaml', 'lib/l10n/*.arb') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        if: steps.dart-tool-cache.outputs.cache-hit != 'true'
        run: flutter gen-l10n

      # flutter_webrtc 1.5.2 (2026-06-20) fixes the libwebrtc symlink
      # extraction path natively, so the previous junction→copy
      # workaround for CMake ≥3.30 is no longer needed. Keeping the
      # junction in place lets flutter_tools' internal
      # createPlatformPluginSymlinks check pass too — replacing it
      # with a real directory was actually breaking the build because
      # Flutter then tried to re-create the symlink over an existing
      # directory and failed with PathExistsException (errno 183).

      - name: Compute build number from version
        id: ver
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build Windows
        run: flutter build windows --release --build-name=${{ steps.ver.outputs.version }} --build-number=${{ steps.ver.outputs.build_number }} --dart-define=STARTUP_DIAG_KEY=${{ secrets.MITGLIEDER_STARTUP_DIAG_KEY }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Bundled into the installer so a machine without the "Visual C++
      # 2015-2022 Redistributable" can still be repaired system-wide. The app
      # itself no longer depends on it — windows/CMakeLists.txt ships the CRT
      # DLLs app-local — but shipping the redist too means the installer is
      # self-contained and never sends the user off to download anything.
      # vs/18 is the current channel: "Microsoft Visual C++ v14 Redistributable"
      # 14.51, matching the MSVC 14.51 toolset VS 2026 builds with. Microsoft
      # dropped the year-based naming after "2015-2022" (vs/17, 14.44) - there
      # is no 2024/2025/2026 redistributable, just one continuously versioned
      # v14 line, binary compatible across 14.x with newer superseding older.
      # Pinning vs/17 here would ship a runtime older than the DLLs the app is
      # actually compiled against.
      #
      # Deliberately fatal: installer.iss compiles happily without the file
      # (FileExists guard), so a silent download failure would ship an
      # installer that looks fine and is missing the runtime repair - exactly
      # the regression this change exists to prevent. Three retries cover
      # transient network faults; anything worse should stop the release.
      - name: Fetch Visual C++ redistributable
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path windows\redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/18/release/vc_redist.x64.exe" `
            -OutFile windows\redist\vc_redist.x64.exe -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
          $size = (Get-Item windows\redist\vc_redist.x64.exe).Length
          if ($size -lt 10MB) { throw "vc_redist.x64.exe is only $size bytes - truncated download" }
          Write-Host "Fetched vc_redist.x64.exe ($([math]::Round($size/1MB,1)) MB)"

      - name: Verify bundled MSVC runtime
        shell: bash
        run: |
          # The app-local CRT is the actual fix for "VCRUNTIME140_1.dll was not
          # found"; if CMake failed to locate the DLLs the build still succeeds
          # but the installer silently regresses, so fail loudly here instead.
          cd build/windows/x64/runner/Release
          # NTFS is case-insensitive but bash globbing is not, and the redist
          # DLLs ship lowercase in some toolsets and mixed-case in others.
          present=$(ls -1 | tr 'A-Z' 'a-z')
          missing=0
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
            if ! grep -qx "$dll" <<< "$present"; then
              echo "::error::$dll missing from the Windows bundle"
              missing=1
            fi
          done
          echo "Bundled runtime DLLs:"
          ls -1 *.dll
          exit $missing

      - name: Create installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ steps.version.outputs.version }}" windows\installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-windows
          path: icd360sev_setup.exe
          if-no-files-found: error

      - name: Save cache marker
        shell: bash
        run: echo "ok" > "$RUNNER_TEMP/win-ok.txt"
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.temp }}/win-ok.txt
          key: v3-build-ok-windows-${{ needs.detect-changes.outputs.win_hash }}

  # ============================================
  # RELEASE UPLOAD (extras): polls until the priority workflow has created
  # the GitHub Release, then appends Windows/Apple assets to it.
  # ============================================
  release-upload-extras:
    name: Release upload (extras)
    needs: [build-apple, build-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all extras artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts/
          pattern: 'icd360sev-{windows,macos,ios}'

      - name: Stage upload set
        id: stage
        run: |
          mkdir -p release/
          # Windows installer
          if compgen -G 'artifacts/icd360sev-windows/icd360sev_setup.exe' > /dev/null; then
            cp artifacts/icd360sev-windows/icd360sev_setup.exe release/icd360sev_setup.exe
          fi
          # macOS DMG
          if compgen -G 'artifacts/icd360sev-macos/icd360sev-mitglied.dmg' > /dev/null; then
            cp artifacts/icd360sev-macos/icd360sev-mitglied.dmg release/icd360sev-mitglied.dmg
          fi
          # iOS .app → zip
          if [ -d artifacts/icd360sev-ios ]; then
            cd artifacts/icd360sev-ios && zip -r ../../release/icd360sev-ios.app.zip . && cd ../..
          fi

          count=$(find release/ -mindepth 1 -maxdepth 1 -type f | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Staged $count extras assets:"
          ls -lh release/ || true

      - name: Generate Windows + macOS manifests
        if: steps.stage.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/workflows/lib/write-manifest.sh
          init_manifest_vars
          if [ -f release/icd360sev_setup.exe ]; then
            write_manifest version_mitglieder_windows.json icd360sev_setup.exe
          fi
          if [ -f release/icd360sev-mitglied.dmg ]; then
            write_manifest version_mitglieder_macos.json icd360sev-mitglied.dmg
          fi
          echo "Generated extras manifests:"
          ls -lh release/version_mitglieder_*.json 2>/dev/null || true

      - name: Wait for priority release to exist
        if: steps.stage.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The priority workflow creates the GitHub Release with generated
          # notes; this job only appends. Cap at 25 minutes — beyond that
          # the priority workflow almost certainly failed, and this job
          # should go red so the failure is visible in the Actions UI.
          for i in $(seq 1 150); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "✓ Release $TAG present, proceeding"
              exit 0
            fi
            echo "  release $TAG not yet present (attempt $i/150), sleeping 10s"
            sleep 10
          done
          echo "::error::Release $TAG did not appear in 25 min — priority workflow likely failed"
          exit 1

      - name: Upload extras to release
        if: steps.stage.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --clobber overwrites any prior asset with the same name, so a
          # retry of this job is idempotent.
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
