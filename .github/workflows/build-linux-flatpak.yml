# CI/CD workflow — Linux + Flatpak (highest-priority track)
# Splits off from the old "priority" workflow so Linux/Flatpak finishes
# first and the Linux .deb/.rpm/.AppImage + .flatpak appear in the
# Actions UI as soon as humanly possible. Android moved to
# build-android.yml; Windows + Apple stay in build-extras-platforms.yml.
# This workflow OWNS the GitHub Release: it creates the release tag with
# Linux + Flatpak assets, and the other two workflows append.
name: Build Linux + Flatpak (priority)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches Vorsitzer's known-working desktop build. Flutter 3.41 on Linux
  # leaves the Flutter content area blank in a Proxmox VM without GPU
  # passthrough (Mesa warnings are the same as Vorsitzer's — they're noise,
  # not the cause; the actual difference is which GL path the renderer
  # picks). Pinning to 3.38.4 brings Mitglieder's renderer in line with
  # Vorsitzer, which is the only iteration that reliably ends with the
  # welcome screen visible on the test VM.
  FLUTTER_VERSION: '3.38.4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # DETECT: compare file hashes with last successful build (Linux only)
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.flags.outputs.linux }}
      linux_hash: ${{ steps.check.outputs.linux_hash }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute hashes
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "linux=true" >> $GITHUB_OUTPUT
            echo "linux_hash=force" >> $GITHUB_OUTPUT
            echo "BUILD ALL: tag or manual trigger"
            exit 0
          fi

          SHARED=$(find lib/ pubspec.yaml l10n.yaml -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
          LINUX_H=$(echo "$SHARED"; find linux/ -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null) && LINUX_H=$(echo "$LINUX_H" | sha256sum | cut -d' ' -f1)

          echo "Hash: LINUX=$LINUX_H"
          echo "linux_hash=$LINUX_H" >> $GITHUB_OUTPUT
          echo "$LINUX_H" > /tmp/linux-h.txt

      - name: Check Linux cache
        id: cache-linux
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/linux-h.txt
          key: v3-build-ok-linux-${{ steps.check.outputs.linux_hash }}
          lookup-only: true

      - name: Set build flags
        id: flags
        run: |
          if [ "${{ steps.cache-linux.outputs.cache-hit }}" == "true" ]; then
            echo "→ linux: SKIP (already built)"
            echo "linux=false" >> $GITHUB_OUTPUT
          else
            echo "→ linux: BUILD"
            echo "linux=true" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # ANALYZE: flutter analyze fails fast on type/import errors before any
  # platform build burns 20+ minutes only to fail at the same problem.
  # ============================================
  analyze:
    name: Analyze
    needs: detect-changes
    if: needs.detect-changes.outputs.linux == 'true'
    # Self-hosted runner on 10.10.10.60 — Flutter SDK at /opt/flutter,
    # ~/.pub-cache persists across builds on NVMe; no cache wrappers needed.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get dependencies + l10n + analyze
        run: |
          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos

  # ============================================
  # LINUX desktop + packages
  # ============================================
  build-linux:
    name: Linux
    needs: [detect-changes, analyze]
    if: needs.detect-changes.outputs.linux == 'true'
    # Self-hosted runner — apt deps (clang/cmake/ninja/libgtk/libsecret/
    # libjsoncpp/libnotify/libayatana/rpm/ruby-dev/fpm/appimagetool)
    # pre-installed; /opt/flutter holds the SDK; NVMe IS the cache.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get dependencies + l10n
        run: |
          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter pub get
          flutter gen-l10n

      - name: Compute build number from version
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/ .*//' | sed 's/+.*//')
          IFS=. read MAJ MIN PAT <<< "$VER"
          BUILD=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        env:
          # Ubuntu 26.04 clang-21 defaults to -Werror=deprecated-declarations;
          # tray_manager and other plugins call deprecated GTK/appindicator
          # APIs that would otherwise break the build.
          CFLAGS: "-Wno-error=deprecated-declarations"
          CXXFLAGS: "-Wno-error=deprecated-declarations"
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
        run: |
          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter build linux --release \
            --no-tree-shake-icons \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=STARTUP_DIAG_KEY=${{ secrets.MITGLIEDER_STARTUP_DIAG_KEY }}

      - name: Upload Linux bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

      # --- Linux Packages ---
      # ruby-dev / rpm / fpm / appimagetool / libfuse2t64 are pre-installed
      # on the self-hosted runner; no install step needed.

      - name: Create .deb
        run: |
          BUNDLE=build/linux/x64/release/bundle
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p /tmp/scripts
          printf '#!/bin/sh\nln -sf /opt/icd360sev-mitglied/icd360sev_mitglied /usr/local/bin/icd360sev_mitglied\n' > /tmp/scripts/postinst
          chmod +x /tmp/scripts/postinst
          fpm -s dir -t deb --name icd360sev-mitglied --version "$VERSION" \
            --description "ICD360S e.V. Mitglieder-App" --maintainer "ICD360S e.V." \
            --url "https://icd360s.de" --license "Proprietary" --architecture amd64 \
            --depends libgtk-3-0 --depends libsecret-1-0 --depends libjsoncpp25 --depends libnotify4 \
            --after-install /tmp/scripts/postinst \
            "$BUNDLE/=/opt/icd360sev-mitglied/" \
            "linux/icd360sev_mitglied.desktop=/usr/share/applications/icd360sev_mitglied.desktop"
          mv icd360sev-mitglied_*.deb icd360sev-mitglied.deb

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-deb
          path: icd360sev-mitglied.deb
          if-no-files-found: error

      - name: Create .rpm
        run: |
          BUNDLE=build/linux/x64/release/bundle
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          fpm -s dir -t rpm --name icd360sev-mitglied --version "$VERSION" \
            --description "ICD360S e.V. Mitglieder-App" --maintainer "ICD360S e.V." \
            --url "https://icd360s.de" --license "Proprietary" --architecture x86_64 \
            --depends gtk3 --depends libsecret --depends jsoncpp --depends libnotify \
            --after-install /tmp/scripts/postinst \
            "$BUNDLE/=/opt/icd360sev-mitglied/" \
            "linux/icd360sev_mitglied.desktop=/usr/share/applications/icd360sev_mitglied.desktop"
          mv icd360sev-mitglied-*.rpm icd360sev-mitglied.rpm

      - name: Upload .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-rpm
          path: icd360sev-mitglied.rpm
          if-no-files-found: error

      - name: Create AppImage
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications
          cp -r "$BUNDLE"/* AppDir/usr/bin/
          [ -d "AppDir/usr/bin/lib" ] && mv AppDir/usr/bin/lib/* AppDir/usr/lib/ && rmdir AppDir/usr/bin/lib
          cp linux/icd360sev_mitglied.desktop AppDir/
          cp linux/icd360sev_mitglied.desktop AppDir/usr/share/applications/
          printf '#!/bin/bash\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/icd360sev_mitglied" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > AppDir/icd360sev_mitglied.png
          ARCH=x86_64 appimagetool --no-appstream AppDir icd360sev-mitglied.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-linux-appimage
          path: icd360sev-mitglied.AppImage
          if-no-files-found: error

      - name: Save cache marker
        run: echo "ok" > /tmp/linux-ok.txt
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/linux-ok.txt
          key: v3-build-ok-linux-${{ needs.detect-changes.outputs.linux_hash }}

  # ============================================
  # FLATPAK (.flatpak single-file bundle for Linux)
  # ============================================
  flatpak:
    name: Flatpak
    needs: [detect-changes, build-linux]
    if: needs.detect-changes.outputs.linux == 'true'
    # Self-hosted runner. flatpak 1.16.6 + flatpak-builder + freedesktop
    # runtime/sdk 24.08 already installed. ~/.cache/flatpak-builder/build/
    # stays warm across tags so libayatana / appindicator dependencies
    # are not recompiled when the manifest is unchanged.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: icd360sev-linux
          path: flatpak/bundle

      - name: Make Flutter binary executable
        run: chmod +x flatpak/bundle/icd360sev_mitglied

      - name: Import Flatpak signing GPG key (idempotent)
        # The key (ID 244C2F8A661420E8, "ICD360S e.V. Flatpak Builds") is
        # already on the self-hosted runner's keyring from the initial
        # generation. We still re-import the secret on every run so a
        # fresh VM / rebuilt runner image can sign without manual
        # intervention. gpg --import is idempotent.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY secret missing"
            exit 1
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import 2>&1 | tail -5
          gpg --list-secret-keys --keyid-format LONG 244C2F8A661420E8 | head -3

      - name: Clone Flathub shared-modules
        run: git clone --depth 1 --branch master https://github.com/flathub/shared-modules.git flatpak/shared-modules

      - name: Inject current version into AppStream metainfo
        run: |
          TAG="${GITHUB_REF_NAME:-v1.8.0}"
          VERSION="${TAG#v}"
          DATE=$(date -u +%Y-%m-%d)
          python3 - <<PYEOF
          import re
          path = 'flatpak/de.icd360s.Mitglieder.metainfo.xml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          new_releases = f'''  <releases>
            <release version="$VERSION" date="$DATE">
              <description>
                <p>Version $VERSION — neueste Aktualisierung.</p>
              </description>
            </release>
          </releases>'''
          content = re.sub(r'  <releases>.*?</releases>', new_releases, content, flags=re.DOTALL)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Injected version=$VERSION date=$DATE into metainfo.xml')
          PYEOF
          cat flatpak/de.icd360s.Mitglieder.metainfo.xml

      - name: Build Flatpak bundle + .flatpakref descriptor
        # Direct flatpak-builder call — the runner already has the
        # runtime/SDK on disk and ~/.cache/flatpak-builder/ stays warm.
        # NO --force-clean: that flag wipes the persistent cache and
        # rebuilds the whole stack every tag.
        #
        # The .flatpak single-file bundle is offline-install only —
        # `flatpak update` against a bundle install is documented to be
        # impossible (flatpak#552). The .flatpakref companion we generate
        # below is the supported update path: when a user installs the
        # .flatpakref, flatpak auto-adds the SuggestRemoteName remote
        # pointing at our Pages OSTree repo, after which `flatpak update`
        # picks up every new tag automatically.
        working-directory: flatpak
        run: |
          rm -rf ../build ../repo
          # --gpg-sign on flatpak-builder + build-bundle + build-update-repo
          # signs every OSTree commit and the summary file with the ICD360S
          # signing key. Without signatures, modern Flatpak refuses to install
          # from custom remotes ("Can't pull from untrusted non-gpg verified
          # remote") and the .flatpakref install flow breaks for users.
          flatpak-builder --user --install-deps-from=flathub \
            --repo=../repo --ccache \
            --gpg-sign=244C2F8A661420E8 \
            ../build de.icd360s.Mitglieder.yml
          flatpak build-bundle \
            --runtime-repo=https://icd360s-e-v.github.io/mitglieder/icd360s-mitglieder.flatpakrepo \
            --gpg-sign=244C2F8A661420E8 \
            ../repo \
            ../icd360sev-mitglied.flatpak \
            de.icd360s.Mitglieder
          # Embed the public-key base64 (committed at .github/flatpak-pubkey.b64)
          # into the .flatpakref so Flatpak auto-configures gpg-verify=true with
          # this exact key when a user installs via the descriptor.
          PUBKEY=$(tr -d '\n' < "$GITHUB_WORKSPACE/.github/flatpak-pubkey.b64")
          cat > ../de.icd360s.Mitglieder.flatpakref <<REFEOF
          [Flatpak Ref]
          Title=ICD360S e.V. Mitglieder
          Name=de.icd360s.Mitglieder
          Branch=master
          Url=https://icd360s-e-v.github.io/mitglieder/repo/
          SuggestRemoteName=icd360s-mitglieder
          Homepage=https://github.com/ICD360S-e-V/mitglieder
          Description=ICD360S e.V. Mitgliederportal — installs with auto-update wired to the GitHub Pages OSTree repo.
          IsRuntime=false
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          GPGKey=$PUBKEY
          REFEOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-flatpak
          path: icd360sev-mitglied.flatpak
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icd360sev-flatpakref
          path: de.icd360s.Mitglieder.flatpakref
          if-no-files-found: error

      # ---- OSTree repo for `flatpak update` (served from GitHub Pages) ----

      - name: Update OSTree repo metadata + static deltas
        run: |
          flatpak build-update-repo --generate-static-deltas \
            --gpg-sign=244C2F8A661420E8 \
            --title="ICD360S e.V. Mitglieder" \
            --prune --prune-depth=3 repo
          du -sh repo

      - name: Assemble gh-pages publish tree
        run: |
          mkdir -p pages-out
          cp -r repo pages-out/repo
          # Embed the ICD360S signing key (committed at
          # .github/flatpak-pubkey.b64) so `flatpak remote-add --from`
          # auto-configures gpg-verify=true with this exact key.
          PUBKEY=$(tr -d '\n' < "$GITHUB_WORKSPACE/.github/flatpak-pubkey.b64")
          cat > pages-out/icd360s-mitglieder.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=ICD360S e.V. Mitglieder
          Url=https://icd360s-e-v.github.io/mitglieder/repo/
          Homepage=https://github.com/ICD360S-e-V/mitglieder
          Comment=Mitgliederportal Auto-Update Repository
          Description=Auto-update Flatpak repository for the ICD360S e.V. member app.
          NoDeps=true
          GPGKey=$PUBKEY
          EOF
          cat > pages-out/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <title>ICD360S e.V. Mitglieder — Flatpak Repo</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1rem; line-height: 1.55; color: #222; }
              code, pre { background: #f4f4f4; border-radius: 4px; font-size: 0.9rem; }
              code { padding: 0.1rem 0.35rem; }
              pre { padding: 1rem; overflow-x: auto; }
              a { color: #1a73e8; }
            </style>
          </head>
          <body>
            <h1>ICD360S e.V. Mitglieder — Flatpak Repository</h1>
            <p>Auto-Update für die Mitglieder-App. Einmal hinzufügen, danach läuft <code>flatpak update</code> automatisch beim nächsten Release.</p>
            <h2>Installation</h2>
            <pre>flatpak remote-add --user --if-not-exists icd360s-mitglieder \
            https://icd360s-e-v.github.io/mitglieder/icd360s-mitglieder.flatpakrepo
          flatpak install --user icd360s-mitglieder de.icd360s.Mitglieder</pre>
            <h2>Update</h2>
            <pre>flatpak update --user</pre>
            <p>Quellcode: <a href="https://github.com/ICD360S-e-V/mitglieder">github.com/ICD360S-e-V/mitglieder</a></p>
          </body>
          </html>
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatpak-pages
          path: pages-out
          if-no-files-found: error

  # ============================================
  # FLATPAK auto-update repo → GitHub Pages
  # ============================================
  deploy-flatpak-pages:
    name: Deploy Flatpak repo to GitHub Pages
    needs: [flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flatpak-pages
          path: pages-out

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-out
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          commit_message: "deploy: flatpak repo ${{ github.ref_name }}"

  # ============================================
  # RELEASE — Linux + Flatpak only
  # ----------------------------------------------------------------------
  # This workflow OWNS the GitHub Release creation: it tags first with
  # Linux + Flatpak assets + version_mitglieder_linux.json manifest, so
  # the download buttons in the Actions UI become clickable as soon as
  # Linux finishes (the slowest of the three platforms here). The Android
  # and extras workflows append to this same release tag.
  # ============================================
  release:
    name: Release (Linux + Flatpak)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Linux + Flatpak artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts/
          pattern: 'icd360sev-{linux,linux-deb,linux-rpm,linux-appimage,flatpak,flatpakref}'

      - name: Prepare release files
        run: |
          mkdir -p release/
          # Linux raw bundle + packages + flatpak
          cd artifacts/icd360sev-linux && tar czf ../../release/icd360sev-linux.tar.gz . && cd ../..
          cp artifacts/icd360sev-linux-deb/*.deb release/icd360sev-mitglied.deb
          cp artifacts/icd360sev-linux-rpm/*.rpm release/icd360sev-mitglied.rpm
          cp artifacts/icd360sev-linux-appimage/*.AppImage release/icd360sev-mitglied.AppImage
          cp artifacts/icd360sev-flatpak/icd360sev-mitglied.flatpak release/icd360sev-mitglied.flatpak
          # .flatpakref is the auto-update-capable installer; instruct users
          # to prefer it over the .flatpak bundle (which is offline-only and
          # cannot be updated in place per flatpak#552).
          cp artifacts/icd360sev-flatpakref/de.icd360s.Mitglieder.flatpakref release/de.icd360s.Mitglieder.flatpakref
          echo "Release files:"
          ls -lh release/

      - name: Generate Linux manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/workflows/lib/write-manifest.sh
          init_manifest_vars
          write_manifest version_mitglieder_linux.json icd360sev-mitglied.AppImage
          echo "Generated manifest:"
          ls -lh release/version_mitglieder_*.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: release/*
