name: PR Check

# Gives every pull request a fast status check (the build workflows only run on
# v* tags, so PRs previously had no CI at all). Mirrors the `analyze` job from
# build-linux-flatpak.yml. Runs on a GitHub-hosted runner (the self-hosted
# runner was retired) with Flutter provisioned by subosito/flutter-action.
# workflow_dispatch lets you run it on demand against any branch.
on:
  pull_request:
    # GitHub's three default types plus two: a draft marked ready for review,
    # and a removed label (`asteapta` holds a PR back from the merge queue).
    # The check then runs again, against today's main, and its end wakes the
    # merge queue (workflow_run). Without them such a PR sat until something
    # else happened to finish (17.10.2026).
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: pub get + l10n + analyze
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
