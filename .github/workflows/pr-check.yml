name: PR Check

# Gives every pull request a fast status check (the build workflows only run on
# v* tags, so PRs previously had no CI at all). Mirrors the `analyze` job from
# build-linux-flatpak.yml: self-hosted runner, Flutter at /opt/flutter.
# workflow_dispatch lets you run it on demand against any branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: pub get + l10n + analyze
        run: |
          export PATH="/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH"
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos
