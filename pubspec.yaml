name: icd360sev_mitglied
description: "MitgliederPortal - ICD360S e.V"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.84.1 # x-release-please-version

environment:
  sdk: ^3.6.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization support
  flutter_localizations:
    sdk: flutter

  # HTTP requests
  http: ^1.2.0

  # Local storage for tokens
  shared_preferences: ^2.3.0

  # State management
  provider: ^6.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Secure storage - encrypted credentials (Android Keystore)
  flutter_secure_storage: ^10.3.1

  # SVG rendering — used for the country flags in the first-launch
  # language selector (assets/flags/<lang>.svg).
  flutter_svg: ^2.0.10

  # Unterschreiben mit dem Finger. Exportiert direkt SVG, und genau das wird
  # gespeichert: der Pfad skaliert verlustfrei in jedes PDF und ist ein
  # Bruchteil so groß wie ein Bild. Druck- und Geschwindigkeitsdaten des
  # Striches werden bewusst NICHT ausgelesen — die wären biometrisch
  # (Art. 9 DSGVO) und würden die Beweistabelle in eine andere Rechtsklasse
  # heben.
  signature: ^6.3.0

  # Declarative animation DSL — replaces hand-rolled AnimationController +
  # Timer in the Claudiu welcome flow. Staggered cascades, fades, slides
  # and delays all express as a single chained expression.
  flutter_animate: ^4.5.2

  # Battle-tested typewriter reveal for Claudiu's greeting line —
  # replaces an AnimatedBuilder + substring(0,...) hack.
  animated_text_kit: ^4.3.0

  # WebView for Android
  webview_flutter: ^4.14.1

  # WebSocket for real-time chat
  web_socket_channel: ^3.0.1

  # WebRTC for voice/video calls. 1.5.2 (2026-06-20, PR #2100) ships
  # the Windows-side libwebrtc extraction fix that makes CMake ≥3.30
  # happy when the plugin is loaded through the .plugin_symlinks
  # junction — so we no longer need the runner-side junction→copy
  # workaround in build-extras-platforms.yml.
  flutter_webrtc: ^1.6.0
  # System ringtone (callee) while a call is ringing (no bundled audio asset).
  flutter_ringtone_player: ^4.0.0
  # Ringback (caller) + busy/rejected tones — generated WAVs in assets/sounds/.
  just_audio: ^0.10.5
  # just_audio has no native Windows/Linux backend. Without this every tone
  # throws MissingPluginException(...just_audio.methods) — verified live on the
  # Windows client 2026-08-11: the member heard no ringback and no busy tone,
  # so a call that was ringing or rejected sounded exactly like a dead app.
  # The vorsitzer app already carries this package.
  just_audio_media_kit: ^2.1.0

  # Battery level monitoring
  battery_plus: ^7.1.1

  # Path provider for temp directory (updates)
  path_provider: ^2.1.6

  # Bilder aus der Systemzwischenablage (Strg+V im Chat). Flutters eigenes
  # Clipboard kann nur Text — flutter#46418. Reines Plattform-C/ObjC/Kotlin,
  # keine zusaetzliche Toolchain (super_clipboard braeuchte Rust + NDK).
  pasteboard: ^0.5.0

  # Android local notifications
  flutter_local_notifications: ^21.0.0

  # Device info for unique device identification
  # Pinned: 12.4.0 uses NSProcessInfo.isiOSAppOnVision unavailable in Xcode 16.x SDK
  device_info_plus: 12.3.0

  # App version info (single source of truth from pubspec.yaml)
  package_info_plus: ^9.0.1

  # Cryptographic hashing (SHA-256)
  crypto: ^3.0.3
  # AES-256-GCM for encrypting outbound diagnostic uploads (StartupDiagnostics
  # → mitglieder_flatpack.php and friends). Pure Dart, works in the flatpak
  # sandbox where native plugins are restricted.
  cryptography: ^2.7.0

  # UUID generation for device ID
  # Auf 4.x gehoben, weil pasteboard uuid ^4 verlangt. Alle vier Aufrufe hier
  # sind const Uuid().v4() ohne Optionen — in 4.x unveraendert. vorsitzer
  # laeuft ohnehin schon auf 4.5.x.
  uuid: ^4.6.0

  # Date formatting and week number calculation
  intl: ^0.20.2

  # File picker for chat attachments
  file_picker: ^10.3.10

  # Image picker for camera and gallery
  image_picker: ^1.2.2

  # Image cropping for document photos in chat
  crop_your_image: ^2.0.0

  # URL launcher for opening downloaded files
  url_launcher: ^6.2.0

  # Open file with default app
  open_filex: ^4.5.0

  # PDF viewer (internal - no external app needed)
  pdfrx: ^2.4.7

  # Root/Jailbreak/Emulator detection
  safe_device: ^1.4.1


  # Permission handler for Android
  permission_handler: ^12.0.3

  # Audio level detection (microphone noise meter)
  noise_meter: ^5.0.1

  # Network connectivity detection (WiFi/4G/5G/offline)
  # Pinned: 7.1.0 uses NWPath.isUltraConstrained (macOS 26 API) which fails on Xcode 16.x
  connectivity_plus: 7.0.0

  # Background service for persistent WebSocket and notifications
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.4

  # WorkManager for background tasks (NO Google!)
  workmanager: ^0.10.7

  # ============================================
  # DESKTOP SUPPORT (Windows, macOS, Linux)
  # ============================================

  # Window management (size, position, minimize to tray)
  window_manager: ^0.5.2

  # Multi-monitor support
  screen_retriever: ^0.2.0

  # Fernwartung (remote support): native input injection on the AGENT side.
  # win32 (SendInput) is Windows-only at runtime but already a transitive dep
  # via window_manager, so it is present in every build. ffi backs the Linux
  # XTest injector. Guarded by Platform checks — no-op off their target OS.
  win32: ^5.15.0
  ffi: ^2.1.0

  # System tray icon and menu
  tray_manager: ^0.5.3


  # Auto-start on boot
  launch_at_startup: ^0.5.1
  windows_notification: ^1.3.0
  network_info_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Enable localization code generation
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/app_icon.ico
    - assets/flags/
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
